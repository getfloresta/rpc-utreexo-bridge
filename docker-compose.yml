version: "3"

services:
  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    restart: always
    entrypoint: bitcoind -txindex=1 -signet -rpcuser=$RPC_USER -rpcpassword=$RPC_PASSWORD -rpcbind=0.0.0.0:38332 -rpcallowip=255.255.255.255/0
    container_name: bitcoind
    environment:
      - RPC_USER=${RPC_USER}
      - RPC_PASSWORD=${RPC_PASSWORD}
    volumes:
      - ./bitcoind/:$HOME/.bitcoin
    ports:
      - 38332:38332
    networks:
      - local-network

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    entrypoint: ./bridge
    command: ["--network", "signet", "--steady-state", "/app/data/hints"]
    container_name: bridge
    environment:
      - BITCOIN_CORE_RPC_URL=bitcoind:38332
      - BITCOIN_CORE_RPC_USER=${RPC_USER}
      - BITCOIN_CORE_RPC_PASSWORD=${RPC_PASSWORD}
      - P2P_PORT=${P2P_PORT}
      - DATA_DIR=/app/data
    volumes:
      - ./bridge/:/app/data
    ports:
      - $P2P_PORT:$P2P_PORT
    networks:
      - local-network
    depends_on:
      - bitcoind

networks:
  local-network:
    driver: bridge