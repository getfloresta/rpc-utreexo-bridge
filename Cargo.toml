[package]
name = "bridge"
version = "0.1.3"
edition = "2021"
rust-version = "1.89.0"
default-run = "bridge"
authors = ["Davidson Souza <davidson.lucas.souza@outlook.com>"]
description = "A hiper specialized Utreexo bridge node"
license = "MIT"
repository = "https://github.com/Davidson-Souza/bridge"
readme = "README.md"
homepage = "https://github.com/Davidson-Souza/bridge"
documentation = "https://github.com/Davidson-Souza/bridge"
keywords = ["utreexo", "bitcoin", "blockchain", "rust"]
categories = ["bitcoin", "tools"]

[dependencies]
bitcoinkernel = "0.3.0"
floresta-db = { git = "https://github.com/Davidson-Souza/floresta-db", branch = "ss-branch" }
bitcoin = { version = "0.32.4", features = ["serde"] }
bip324 = "0.11.0"
self_cell = "1.3.0"
bitcoincore-rpc = "0.19"
mio = { version = "1.0.2", features = ["net", "os-poll"] }
rustreexo = { git = "https://github.com/Davidson-Souza/rustreexo", branch = "bridge", features = ["with-serde"] }
rayon = "1.10"
sha2 = "0.10.6"
anyhow = "1.0.71"
serde = "1.0.183"
kv = "0.24.0"
hex = "0.4.3"
log = "0.4.19"
simplelog = "0.12.1"
reqwest = { version = "0.11.18", features = [
    "blocking",
    "rustls",
    "__tls",
    "__rustls",
    "rustls-tls-webpki-roots",
], optional = true, default-features = false }
serde_json = { version = "1.0.128" }
hintsfile = "0.1.1"
libc = "0.2"
memmap2 = "0.9"
io-uring = "0.7.15"
jemallocator = "0.5.4"
clap = { version = "4.5.20", features = ["derive"] }
ahash = "0.8.11"
parking_lot = "0.11.2"
ctrlc = "3.4.5"
dotenv = "0.15.0"

[features]
esplora = ["reqwest"]

[dev-dependencies]
